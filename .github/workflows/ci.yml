name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Shared frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: shared-web-assets
          path: dist/
          if-no-files-found: error

  windows:
    name: Windows executable
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: rustup update stable --no-self-update
      - run: npm ci
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo test --locked
        working-directory: src-tauri
      - run: npm run tauri -- build --no-bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: insp-windows-x64
          path: src-tauri/target/release/insp-notes.exe
          if-no-files-found: error

  sync-server:
    name: Linux encrypted sync server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup update stable --no-self-update
      - run: cargo fmt --check
        working-directory: server
      - run: cargo test --locked
        working-directory: server
      - run: cargo build --release --locked
        working-directory: server
      - name: Build Linux deployment image
        run: docker build --tag insp-sync:ci server
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: insp-sync-linux-x64
          path: server/target/release/insp-sync-server
          if-no-files-found: error

  android:
    name: Android emulator APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          rustup update stable --no-self-update
          rustup target add x86_64-linux-android
      - run: npm ci
      - name: Build APK
        run: |
          chmod +x src-tauri/gen/android/gradlew
          npm run tauri -- android build --debug --apk --target x86_64
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: insp-android-x86_64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
